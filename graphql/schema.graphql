    version_id: ID!
    name: String
    code: String
    description: String
    type_id: Int
    additional_fields: [AdditionalFieldInput!]
    enable_assembly_groups: Boolean
}

type EditPublishedVersionResponse {
    success: Boolean!
    message: String
}

input EditGroupInput {
    id: ID!
    name: String
    type_id: ID
    is_optional: Boolean
    version_id: ID
    assembler_id: ID
}

extend type Query {
    getVersionByCode(
        part_id: Int!
        revision_id: Int!
        version_code: String!
    ): Version
        @field(
            resolver: "App\\GraphQL\\Mutations\\VersionResolver@getVersionByCode"
        )
}

input VersionFiltersInput {
    enable_assembly_groups: Boolean
    status: String
    revision_id: ID
}
extend type Query {
    searchVersionsAssembler(filter: VersionFiltersInput): [Version!]!
        @field(
            resolver: "App\\GraphQL\\Mutations\\VersionResolver@searchVersionsAssembler"
        )
}

type Query {
    additionalFieldsByVersionId(version_id: ID!): [AdditionalField!]!
        @field(
            resolver: "App\\GraphQL\\Resolvers\\AdditionalFieldResolver@getAllVersion"
        )

    additionalField(id: ID!): AdditionalField
        @field(
            resolver: "App\\GraphQL\\Resolvers\\AdditionalFieldResolver@getVersionById"
        )

    getParts(published: Boolean!): [Part!]!
        @field(
            resolver: "App\\GraphQL\\Queries\\PartQuery@getPartsByPublishedStatus"
        )
}

input PartFilterInput {
    keyword: String
    type_id: ID
    published: Boolean
    is_assembler: Boolean
}

extend type Query {
    filterParts(filter: PartFilterInput): [Part!]!
        @field(resolver: "App\\GraphQL\\Queries\\PartQuery@filterParts")
}

extend type Mutation {
    updatePart(input: UpdatePartInput!): Version
        @field(resolver: "App\\GraphQL\\Mutations\\PartResolver@updatePart")

    deleteDraftVersion(version_id: ID!): Boolean
