            resolver: "App\\GraphQL\\Mutations\\PartResolver@clonePublishedVersion"
        )

    deletePart(id: ID!): Boolean
        @field(resolver: "App\\GraphQL\\Mutations\\PartResolver@deletePart")

    deleteGroup(id: ID!): Boolean
        @field(
            resolver: "App\\GraphQL\\Mutations\\GroupPartResolver@deleteGroup"
        )
    deleteGroupPartById(id: Int!): Boolean
        @field(resolver: "GroupPartResolver@deleteGroupPartById")

    updateGroup(input: EditGroupInput!): Group!
        @field(
            resolver: "App\\GraphQL\\Mutations\\GroupResolver@updateGroupById"
        )
    createGroup(input: CreateGroupInput!): Group
