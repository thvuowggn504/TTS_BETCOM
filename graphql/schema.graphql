type Part {
    id: ID!
    name: String!
    code: String!
    type: Type!
    revisions: [Revision!]! @hasMany
    latestVersion: Version
    additionalFields: [AdditionalField]
}

type Revision {
    id: ID!
    revision_code: String!
    part: Part! @belongsTo
    versions: [Version!]! @hasMany
}

type Type {
    id: ID!
    name: String!
}

type Version {
    id: ID!
    version_code: String!
    name: String!
    code: String!
    based_upon_version_id: Version
    description: String
    type: Type!
    status: String
    revision: Revision! @belongsTo
}

type AdditionalField {
    id: ID!
    name: String!
    value: String
    type_id: ID
    data_type: String
    created_at: DateTime
    updated_at: DateTime
}

extend type Query {
    hello: String @field(resolver: "App\\GraphQL\\Queries\\Hello@__invoke")
    getVersion(partId: ID!, revisionId: ID!, versionCode: String!): Version
        @field(resolver: "App\\GraphQL\\Queries\\PartQuery@getVersion")
    
    parts: [Part!] @field(resolver: "App\\GraphQL\\Queries\\PartQuery@getAllParts")
}

extend type Mutation {
    createPart(input: CreatePartInput): Part @field(resolver: "App\\GraphQL\\mutations\\PartResolver@createPart")
}

# ----------------------------------------------------------------------------------------------

type GroupPart {
    id: ID!
    group_id: ID!
    part_id: ID!
    quantity: Int!
    group: Group @belongsTo
    part: Part @belongsTo
    created_at: DateTime
    updated_at: DateTime
}

type Query {
    groupParts: [GroupPart!]! @all
    groupPart(id: ID!): GroupPart @find
}

type Mutation {
    createGroupPart(input: CreateGroupPartInput!): GroupPart
        @field(resolver: "App\\GraphQL\\Mutations\\GroupPartResolver@create")

    updateGroupPart(id: ID!, input: UpdateGroupPartInput!): GroupPart
        @update(model: "App\\Models\\GroupPart")

    deleteGroupPart(id: ID!): Boolean @delete(model: "App\\Models\\GroupPart")
}

input CreateGroupPartInput {
    group_id: ID! @rules(apply: ["required", "exists:groups,id"])
    part_id: ID! @rules(apply: ["required", "exists:parts,id"])
    quantity: Int! @rules(apply: ["required", "integer", "min:1"])
}

input UpdateGroupPartInput {
    quantity: Int! @rules(apply: ["required", "integer", "min:1"])
}

type Group {
    id: ID!
    assembler_id: ID!
    name: String!
    version_id: ID
    is_optional: Boolean
    created_at: DateTime
    updated_at: DateTime

    assembler: Part @belongsTo
    version: Version @belongsTo
    groupParts: [GroupPart!]! @hasMany
}

extend type Query {
    groups: [Group!]! @all
    group(id: ID!): Group @find
}

extend type Mutation {
    createGroup(input: CreateGroupInput!): Group
        @create(model: "App\\Models\\Group")

    updateGroup(id: ID!, input: UpdateGroupInput!): Group
        @update(model: "App\\Models\\Group")

    deleteGroup(id: ID!): Boolean @delete(model: "App\\Models\\Group")
}

input CreateGroupInput {
    assembler_id: ID! @rules(apply: ["required", "exists:parts,id"])
    name: String! @rules(apply: ["required", "string", "max:100"])
    version_id: ID @rules(apply: ["nullable", "exists:versions,id"])
    is_optional: Boolean
}

input UpdateGroupInput {
    name: String @rules(apply: ["string", "max:100"])
    is_optional: Boolean
}

