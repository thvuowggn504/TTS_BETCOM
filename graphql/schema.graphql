input AddPropertyToCodebuilderInput {
    id: ID!
    group_id: ID
    # field_id: ID
    field_name: String!
}

input StoreRuleToInput {
    id: ID!
    rule: String!
}

input CreateCodebuilderInput {
    version_id: ID!
    rule: String
    name: String
    is_default: Boolean = false
}

input UpdateCodebuilderInput {
    id: ID!
    rule: String
    name: String
    is_default: Boolean
}

type GeneratedCode {
    id: ID!
    generatedCode: String @method(name: "generatedCode")
}

extend type Query {
    validateGeneratedCode(codebuilderId: ID!): Boolean
        @field(resolver: "App\\GraphQL\\Queries\\GeneratedCodeQuery@validate")
    getCodeByCodebuilder(codebuilderId: ID!): [GeneratedCode!]
        @field(resolver: "App\\GraphQL\\Queries\\GeneratedCodeQuery@getCode")
}

